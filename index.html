<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- Icon font subset to the glyphs this app renders. Keep `icon_names` in sync
       with the sources: src/materialSymbolsSubset.test.mjs fails when a source
       names a glyph this list is missing, because a missing glyph does not draw
       a box — the ligature never forms and the element renders the literal word. -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,flare,flight,fullscreen,fullscreen_exit,home,layers_clear,light_mode,local_fire_department,my_location,navigation,normal,on,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,skip_next,skip_previous,view_in_ar" rel="stylesheet" />
</head>
<body>
  <!-- gev:template scene-chrome -->

  <!-- gev:template cockpit -->

  <!-- gev:template display-controls -->

  <!-- gev:template command-dock -->

  <!-- gev:template layer-panels -->

  <!-- gev:template context -->

  <!-- gev:template welcome -->

  <!-- gev:template provider-settings -->

  <!-- gev:template hud-loading -->

  <!-- MilitarySpend fork chrome. Hidden inside the militaryspend.org iframe;
       shown on a direct visit so people find the front door. -->
  <a id="ms-return" href="https://militaryspend.org/globe" hidden
     style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:400;padding:6px 12px;background:rgba(0,0,0,.72);color:#fff;font:600 12px/1.2 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:1px solid rgba(255,255,255,.18)">
    MilitarySpend SITREP — open on militaryspend.org/globe
  </a>
  <script>
    if (window.top === window.self) document.getElementById('ms-return').hidden = false;
    // Home + fullscreen live in the top-center action bar (templated after
    // boot, hence delegation). Fullscreen covers this document only — inside
    // the militaryspend.org frame that is the globe, not the site page.
    document.addEventListener('click', (event) => {
      if (event.target.closest('#ms-home')) {
        window.top.location.href = 'https://militaryspend.org/';
      } else if (event.target.closest('#fullscreen-toggle')) {
        if (document.fullscreenElement) document.exitFullscreen?.();
        else document.documentElement.requestFullscreen?.().catch(() => {});
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const button = document.getElementById('fullscreen-toggle');
      if (!button) return;
      const on = Boolean(document.fullscreenElement);
      button.setAttribute('aria-pressed', String(on));
      button.setAttribute('aria-label', on ? 'Exit fullscreen' : 'Enter fullscreen');
      button.title = on ? 'Exit fullscreen' : 'Fullscreen';
      button.querySelector('span').textContent = on ? 'fullscreen_exit' : 'fullscreen';
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
